[project]
name = "jev-cyrillic-audit"
version = "0.0.0"
description = "Does Jev keep its accuracy and calibration on Russian? An independent, reproducible RU vs EN audit on parallel human-labelled data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk==0.7.0",
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "openai>=3.19.2",
    "pymorphy3>=2.0.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "netcal>=1.3",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_cyrillic_audit"]
